# GLORYS truth of the OSSE-3D Gulf Stream task, one variable per level.
#
# Built from the store `oceanml3d-core` prepares (`glorys/glorys_gs_multidepth_<first>-<last>.zarr`),
# whose variables are thetao/uo/vo/zos with a depth axis. `split` flattens that axis into the
# `<var>_d<ii>` names this manifest and `benchmarks/osse3d_gs21.yaml` use -- the indices are
# positions on the file's depth axis, the same `depth_index` as in core's config/data/osse3d_gs21.yaml:
#
#   oceanml3d-eval split \
#     --input $OCEANML3D_DATA/glorys/glorys_gs_multidepth_2010-2020.zarr \
#     --out $OCEANML3D_DATA/glorys_gs21_truth --name glorys_gs21_truth \
#     --var ssh=zos --var thetao=thetao --var u=uo --var v=vo \
#     --depth-indices 0,2,4,6,8,10-25
#
# `split` writes its own product.yaml next to the daily files; this file is the same manifest with
# ${OCEANML3D_DATA} kept symbolic, so the benchmark resolves it on any machine.
format_version: 2
name: glorys_gs21_truth
path: ${OCEANML3D_DATA}/glorys_gs21_truth/daily
pattern: glorys_gs21_truth_(\d{4})-(\d{2})-(\d{2})\.nc
